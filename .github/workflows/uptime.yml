name: uptime
on:
  schedule:
    - cron: "*/5 * * * *"   # GitHub may delay scheduled runs by several minutes under load
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: uptime
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Restore previous state
        uses: actions/cache/restore@v4
        with:
          path: state
          key: uptime-state-none
          restore-keys: uptime-state-
      - name: Check sites and notify on change
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          mkdir -p state; touch state/prev; : > state/now
          while read -r url; do
            case "$url" in ""|\#*) continue;; esac
            code=000
            for try in 1 2 3; do
              code=$(curl -s -o /dev/null -m 15 -w '%{http_code}' -A 'uptime-monitor (github actions)' "$url" || true)
              [ "$code" != 000 ] && [ "$code" -lt 500 ] && break
              sleep 10
            done
            if [ "$code" != 000 ] && [ "$code" -lt 500 ]; then s=UP; else s=DOWN; fi
            echo "$s $code $url" | tee -a state/now
          done < sites.txt
          msg=""
          while read -r s code url; do
            was=$(awk -v u="$url" '$3==u{print $1}' state/prev)
            [ "$s" = "DOWN" ] && [ "$was" != "DOWN" ] && msg="$msg"$'\n'"DOWN: $url (got $code)"
            [ "$s" = "UP" ] && [ "$was" = "DOWN" ] && msg="$msg"$'\n'"RECOVERED: $url"
          done < state/now
          if [ -n "$msg" ]; then
            echo "changes:$msg"
            if [ -n "$NTFY_TOPIC" ]; then
              curl -s -m 20 -H "Title: Uptime (external)" -H "Priority: high" -d "${msg#?}" "https://ntfy.sh/$NTFY_TOPIC" >/dev/null || true
            else
              echo "NTFY_TOPIC secret not set: no notification sent"
            fi
          fi
          cp state/now state/prev; rm state/now
          ! grep -q '^DOWN' state/prev || echo "::warning::some sites are DOWN"
      - name: Save state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state
          key: uptime-state-${{ github.run_id }}-${{ github.run_attempt }}
